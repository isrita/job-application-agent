[project]
name = "job-application-agent"
version = "0.1.0"
description = "Multi-candidate job application agent with document ingestion, interview tracking, and feedback continuous improvement loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
]

[project.scripts]
job-agent = "job_agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
