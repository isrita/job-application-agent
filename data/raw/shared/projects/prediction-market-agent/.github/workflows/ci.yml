name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --locked --python 3.11
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m market_agent doctor
      - run: uv run --locked python -m market_agent blueprint
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/kalshi-btc15m/package-lock.json
      - run: npm ci --prefix apps/kalshi-btc15m
      - run: npm test
      - run: npm run check
