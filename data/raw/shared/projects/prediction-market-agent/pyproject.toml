[project]
name = "prediction-market-agent"
version = "1.0.0"
description = "Sports prediction-market arbitrage orchestration blueprint"
requires-python = ">=3.11"
dependencies = [
    "predictefy==1.0.0b8",
]

[project.scripts]
prediction-markets = "market_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_agent*"]
