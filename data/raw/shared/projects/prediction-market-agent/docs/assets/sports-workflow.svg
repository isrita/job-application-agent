<rect x="350" y="430" width="260" height="90" rx="12" fill="#152031" stroke="#81dfae"/><text x="366" y="464" fill="#81dfae" font-size="19" font-weight="bold">8 · Paper outcomes</text><text x="366" y="493" fill="#d2dce7" font-size="14">Traceable replay and performance</text>
<rect x="660" y="430" width="260" height="90" rx="12" fill="#152031" stroke="#bca5ff"/><text x="676" y="464" fill="#bca5ff" font-size="19" font-weight="bold">Future · Learning</text><text x="676" y="493" fill="#d2dce7" font-size="14">Offline models; human evaluation</text>
