<rect x="40" y="120" width="260" height="90" rx="12" fill="#152031" stroke="#69d2ff"/><text x="56" y="154" fill="#69d2ff" font-size="19" font-weight="bold">1 · Research</text><text x="56" y="183" fill="#d2dce7" font-size="14">Match fixtures and settlement rules</text>
<rect x="350" y="120" width="260" height="90" rx="12" fill="#152031" stroke="#ffcd66"/><text x="366" y="154" fill="#ffcd66" font-size="19" font-weight="bold">2 · Human review</text><text x="366" y="183" fill="#d2dce7" font-size="14">New / changed evidence</text>
<rect x="660" y="120" width="260" height="90" rx="12" fill="#152031" stroke="#69d2ff"/><text x="676" y="154" fill="#69d2ff" font-size="19" font-weight="bold">3 · Fresh quote capture</text><text x="676" y="183" fill="#d2dce7" font-size="14">Read-only venue collectors</text>
<path d="M300 165 L350 165" fill="none" stroke="#8eabbd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610 165 L660 165" fill="none" stroke="#8eabbd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="270" width="260" height="90" rx="12" fill="#152031" stroke="#d8a66b"/><text x="676" y="304" fill="#d8a66b" font-size="19" font-weight="bold">4 · Bronze</text><text x="676" y="333" fill="#d2dce7" font-size="14">Immutable raw observations</text>
<rect x="350" y="270" width="260" height="90" rx="12" fill="#152031" stroke="#c7d4e0"/><text x="366" y="304" fill="#c7d4e0" font-size="19" font-weight="bold">5 · Silver + snapshot</text><text x="366" y="333" fill="#d2dce7" font-size="14">Canonical, validated, coherent</text>
<rect x="40" y="270" width="260" height="90" rx="12" fill="#152031" stroke="#69d2ff"/><text x="56" y="304" fill="#69d2ff" font-size="19" font-weight="bold">6 · Coverage + risk</text><text x="56" y="333" fill="#d2dce7" font-size="14">Deterministic costs and liquidity</text>
<path d="M790 210 L790 270" fill="none" stroke="#8eabbd" stroke-width="2" marker-end="url(#arrow)"/>
