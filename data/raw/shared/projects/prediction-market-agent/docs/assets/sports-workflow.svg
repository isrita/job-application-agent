<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Human-assisted sports arbitrage workflow</title><desc id="desc">Research and human evidence review precede fresh quotes, Bronze, Silver, a snapshot, deterministic evaluation and Gold paper results. Sports runtime is planned.</desc>
